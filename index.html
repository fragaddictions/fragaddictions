<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>FRAGRANCE ADDICTIONS - Inventory</title>
<style>
  :root{
    --bg:#0c0c0e; --panel:#141417; --panel2:#1b1b1f;
    --line:#26262c; --gold:#c9a86a; --gold-dim:#8a744d;
    --text:#e8e4da; --muted:#9a958a; --red:#c05353; --green:#6fae7f;
  }
  *{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  body{background:var(--bg);color:var(--text);font-family:Georgia,'Times New Roman',serif;padding-bottom:60px}
  header{padding:28px 18px 18px;text-align:center;border-bottom:1px solid var(--line);
    background:linear-gradient(180deg,#121216,#0c0c0e)}
  h1{font-size:26px;letter-spacing:4px;color:var(--gold);font-weight:normal}
  .sub{color:var(--muted);font-size:12px;letter-spacing:2px;margin-top:6px;text-transform:uppercase}
  .stats{display:flex;justify-content:center;gap:10px;margin-top:16px;flex-wrap:wrap}
  .stat{background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:8px 14px;text-align:center;min-width:86px}
  .stat b{display:block;font-size:18px;color:var(--gold);font-weight:normal}
  .stat span{font-size:10px;color:var(--muted);letter-spacing:1px;text-transform:uppercase}
  .filters{display:flex;gap:8px;padding:14px 14px 4px;overflow-x:auto;position:sticky;top:0;background:var(--bg);z-index:5}
  .chip{flex:1;min-width:72px;background:var(--panel);border:1px solid var(--line);color:var(--muted);
    padding:9px 4px;border-radius:20px;font-size:12px;letter-spacing:1px;text-transform:uppercase;
    font-family:inherit;cursor:pointer;text-align:center;white-space:nowrap}
  .chip.active{background:var(--gold);color:#141414;border-color:var(--gold);font-weight:bold}
  .brand{margin:20px 14px 0}
  .brand h2{font-size:14px;letter-spacing:3px;color:var(--gold);text-transform:uppercase;
    border-bottom:1px solid var(--line);padding-bottom:6px;font-weight:normal}
  .item{display:flex;align-items:center;justify-content:space-between;gap:8px;background:var(--panel);
    border:1px solid var(--line);border-radius:10px;padding:12px;margin-top:8px;cursor:pointer}
  .item:active{background:var(--panel2)}
  .item .left{flex:1;min-width:0}
  .item .name{font-size:15px}
  .item .tags{margin-top:4px;display:flex;gap:6px;flex-wrap:wrap}
  .tag{font-size:9px;letter-spacing:1px;text-transform:uppercase;padding:2px 7px;border-radius:10px;border:1px solid}
  .tag.sold{color:var(--red);border-color:var(--red)}
  .tag.recv{color:var(--green);border-color:var(--green)}
  .tag.note{color:var(--gold);border-color:var(--gold-dim)}
  .item .right{text-align:right;flex-shrink:0}
  .qty{font-size:17px;color:var(--gold)}
  .qty small{font-size:11px;color:var(--muted)}
  .msrp{font-size:12px;color:var(--muted);margin-top:2px}
  .item.oos{opacity:.45}
  .oos-banner{font-size:9px;color:var(--red);letter-spacing:1px;margin-top:2px}
  .footer{text-align:center;color:var(--muted);font-size:11px;margin-top:36px;letter-spacing:1px}
  /* modal */
  .overlay{display:none;position:fixed;inset:0;background:rgba(0,0,0,.78);z-index:50;align-items:center;justify-content:center;padding:20px}
  .overlay.open{display:flex}
  .card{background:var(--panel2);border:1px solid var(--gold-dim);border-radius:14px;max-width:360px;width:100%;
    max-height:90vh;overflow-y:auto;padding:18px;position:relative}
  .close{position:absolute;top:10px;right:12px;background:none;border:none;color:var(--muted);font-size:26px;cursor:pointer;line-height:1}
  .imgbox{height:180px;border:1px dashed var(--gold-dim);border-radius:10px;display:flex;align-items:center;
    justify-content:center;color:var(--muted);font-size:11px;letter-spacing:2px;text-transform:uppercase;margin-bottom:14px}
  .mbrand{font-size:11px;letter-spacing:3px;color:var(--gold);text-transform:uppercase}
  .mname{font-size:21px;margin:4px 0 12px}
  .row{display:flex;justify-content:space-between;padding:9px 0;border-bottom:1px solid var(--line);font-size:14px}
  .row span:first-child{color:var(--muted)}
</style>
</head>
<body>

<header>
  <h1>FRAGRANCE ADDICTIONS</h1>
  <div class="sub">Collector Inventory</div>
  <div class="stats">
    <div class="stat"><b>68</b><span>Bottles</span></div>
    <div class="stat"><b>$17,099</b><span>Retail Value</span></div>
    <div class="stat"><b>27</b><span>Brands</span></div>
    <div class="stat"><b>48</b><span>Lines</span></div>
  </div>
</header>

<div class="filters">
  <button class="chip active" data-f="All">All</button>
  <button class="chip" data-f="Mens">Mens</button>
  <button class="chip" data-f="Womens">Womens</button>
  <button class="chip" data-f="Unisex">Unisex</button>
</div>

<div id="list"></div>

<div class="footer">Tap any bottle for details &middot; Images coming soon</div>

<div class="overlay" id="overlay">
  <div class="card">
    <button class="close" onclick="closeModal()">&times;</button>
    <div class="imgbox" id="mImg">Image coming soon</div>
    <div class="mbrand" id="mBrand"></div>
    <div class="mname" id="mName"></div>
    <div class="row"><span>Gender</span><span id="mGender"></span></div>
    <div class="row"><span>In Stock</span><span id="mQty"></span></div>
    <div class="row"><span>MSRP</span><span id="mMsrp"></span></div>
    <div class="row" id="rRecv" style="display:none"><span>Received</span><span id="mRecv"></span></div>
    <div class="row" id="rSold" style="display:none"><span>Sold</span><span id="mSold"></span></div>
    <div class="row" id="rNote" style="display:none"><span>Note</span><span id="mNote"></span></div>
  </div>
</div>

<script>
var INV = [
["Armani","Acqua Di Gio",1,"Mens",175.00,"", "", ""],

["Fragrance Story","Deadly",1,"Mens",96.00,"","1 (11/8/2026)",""],
["Game of Spades","Full House",0,"Unisex",220.00,"","",""],

["Louis Vuitton","Orage",2,"Mens",360.00,"","","1 - personal inventory"],

["YSL","Myslf - L'absolu (silver)",2,"Mens",170.00,"11/4/2026","",""],
["Zakart","Z25",1,"Unisex",65.00,"","",""]
];

function esc(s){return s.replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;")}

var filter = "All";
var brands = [];
INV.forEach(function(r){ if(brands.indexOf(r[0])<0) brands.push(r[0]) });
brands.sort();

function render(){
  var html = "";
  brands.forEach(function(b){
    var rows = INV.map(function(r,i){return {r:r,i:i}}).filter(function(o){return o.r[0]===b && (filter==="All"||o.r[3]===filter)});
    if(!rows.length) return;
    html += '<div class="brand"><h2>'+esc(b)+'</h2>';
    rows.forEach(function(o){
      var r=o.r;
      html += '<div class="item'+(r[2]===0?' oos':'')+'" onclick="openModal('+o.i+')">'
        + '<div class="left"><div class="name">'+esc(r[1])+'</div><div class="tags">'
        + (r[6]?'<span class="tag sold">Sold</span>':'')
        + (r[5]?'<span class="tag recv">Received</span>':'')
        + (r[7]?'<span class="tag note">Note</span>':'')
        + '</div></div>'
        + '<div class="right">'
        + (r[2]===0?'<div class="oos-banner">Out of stock</div>':'<div class="qty">'+r[2]+' <small>in stock</small></div>')
        + '<div class="msrp">$'+r[4].toFixed(2)+'</div></div></div>';
    });
    html += '</div>';
  });
  document.getElementById('list').innerHTML = html;
}

document.querySelectorAll('.chip').forEach(function(c){
  c.addEventListener('click',function(){
    document.querySelectorAll('.chip').forEach(function(x){x.classList.remove('active')});
    c.classList.add('active');
    filter = c.dataset.f;
    render();
  });
});

function openModal(i){
  var r = INV[i];
  document.getElementById('mBrand').textContent = r[0];
  document.getElementById('mName').textContent = r[1];
  document.getElementById('mGender').textContent = r[3];
  document.getElementById('mQty').textContent = r[2]===0 ? 'Out of stock' : r[2];
  document.getElementById('mMsrp').textContent = '$'+r[4].toFixed(2);
  document.getElementById('rRecv').style.display = r[5]?'flex':'none';
  document.getElementById('mRecv').textContent = r[5];
  document.getElementById('rSold').style.display = r[6]?'flex':'none';
  document.getElementById('mSold').textContent = r[6];
  document.getElementById('rNote').style.display = r[7]?'flex':'none';
  document.getElementById('mNote').textContent = r[7];
  document.getElementById('overlay').classList.add('open');
}
function closeModal(){ document.getElementById('overlay').classList.remove('open') }
document.getElementById('overlay').addEventListener('click',function(e){ if(e.target===this) closeModal() });

render();
</script>

</body>
</html>
